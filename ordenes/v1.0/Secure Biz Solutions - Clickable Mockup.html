<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Secure Biz Website Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: the approved Secure Biz light site ? white/light-gray alternating bands, 1200px column, plum anchors, teal acts. Single light look by design (spec: light site, footer is the only dark area). */
:root{
  --plum:#86004D; --teal:#0F6E6E; --teal-h:#0B5757; --ink:#333333; --gray:#F6F5F7; --line:#E8E6EC;
  --white:#FFFFFF; --foot:#1F1F23; --foot-t:#C9C8CF; --small:#6B6B72;
  --proto:#FFF4CC; --proto-line:#E2C766; --proto-ink:#5A4A00;
  --fd:"Poppins","Segoe UI",Helvetica,Arial,sans-serif; --fb:"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6}
a{color:var(--teal)} a:hover{color:var(--teal-h)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);color:var(--plum);text-wrap:balance;margin:0}
h1{font-size:44px;line-height:1.15;font-weight:700}
h2{font-size:30px;line-height:1.25;font-weight:700}
h3{font-size:18px;line-height:1.35;font-weight:600}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-inline:24px}
.narrow{max-width:760px;margin:0 auto}
.small{font-size:13px;color:var(--small);line-height:1.5}

/* prototype chrome */
.proto{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--proto);border-bottom:1px dashed var(--proto-line);color:var(--proto-ink);font-size:13px}
.proto .wrap{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding-block:7px}
.proto b{font-weight:600}
.proto code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--proto-line);border-radius:4px;padding:1px 6px}
.proto button{font:inherit;color:var(--proto-ink);background:#fff;border:1px solid var(--proto-line);border-radius:6px;padding:3px 10px;cursor:pointer}
.proto .sp{flex:1}
.pages{position:fixed;inset:0;z-index:80;background:rgba(31,31,35,.35);display:flex;justify-content:flex-end}
.pages .pnl{background:#fff;width:min(420px,100%);height:100%;overflow:auto;padding:20px 20px 40px}
.pages h4{font-family:var(--fd);color:var(--plum);margin:18px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.pages a{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px}
.pages a:hover{background:var(--gray)} .pages a span{color:var(--small);font-size:12px;font-family:ui-monospace,Menlo,monospace}
.note{display:none;font:600 11px/1.4 ui-monospace,Menlo,monospace;color:var(--proto-ink);background:var(--proto);border:1px dashed var(--proto-line);border-radius:4px;padding:2px 8px;width:max-content;max-width:100%;margin-bottom:14px}
body.shownotes .note{display:block}

/* header */
header.site{position:sticky;top:calc(env(safe-area-inset-top,0px) + 35px);z-index:50;background:var(--white);border-bottom:1px solid var(--line)}
header.site .wrap{display:flex;align-items:center;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--plum);font-family:var(--fd);font-weight:700;font-size:19px;line-height:1.05;white-space:nowrap}
.logo .mk{width:34px;height:34px;border-radius:8px;border:2px solid var(--plum);display:grid;place-items:center;font-size:15px}
.logo small{display:block;font-family:var(--fb);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
nav.main{display:flex;gap:4px;margin-inline:auto}
nav.main .it{position:relative}
nav.main .it>a,nav.main .it>button{display:block;font:500 15px var(--fb);color:var(--plum);text-decoration:none;background:none;border:0;padding:10px 12px;cursor:pointer;border-radius:6px}
nav.main .it>a:hover,nav.main .it>button:hover{background:var(--gray)}
.dd{position:absolute;top:100%;left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(31,31,35,.10);padding:8px;min-width:250px;display:none}
.it:hover .dd,.it:focus-within .dd{display:block}
.dd a{display:block;padding:8px 10px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:15px}
.dd a:hover{background:var(--gray);color:var(--plum)}
.hright{display:flex;align-items:center;gap:16px;white-space:nowrap}
.tel{font-weight:600;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:8px;background:var(--teal);color:#fff!important;font:600 16px var(--fb);text-decoration:none;border:0;cursor:pointer}
.btn:hover{background:var(--teal-h)}
.btn.ghost{background:#fff;color:var(--teal)!important;border:2px solid var(--teal)}
.menubtn{display:none;margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;cursor:pointer;color:var(--plum)}
.mmenu{position:fixed;inset:0;z-index:70;background:#fff;overflow:auto;padding:20px 24px 100px}
.mmenu .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mmenu h4{font:600 12px var(--fb);letter-spacing:.12em;text-transform:uppercase;color:var(--small);margin:18px 0 4px}
.mmenu a{display:block;padding:9px 0;color:var(--plum);font:600 17px var(--fd);text-decoration:none;border-bottom:1px solid var(--line)}
.stickybar{display:none}

/* sections */
section{padding-block:80px}
section.gray{background:var(--gray)}
.hero{padding-block:64px 72px}
.hero .grid{display:grid;grid-template-columns:55fr 45fr;gap:56px;align-items:center}
.hero .grid>*{min-width:0}
.hero .sub{font-size:18px;margin-top:18px;max-width:58ch}
.hero .actions{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-top:28px}
.hero .under{font-size:15px;margin-top:14px}
.hero.center{text-align:center}
.hero.center .sub{margin-inline:auto}
.hero.center .actions{justify-content:center}
.pill{display:inline-block;background:var(--gray);color:var(--plum);font:600 14px var(--fb);border-radius:999px;padding:5px 14px;margin-bottom:16px}
.ph{position:relative;background:var(--gray);border:1px solid var(--line);border-radius:12px;aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;text-align:center;padding:18px;color:var(--small);font-size:13px}
.ph b{display:block;font:600 13px ui-monospace,Menlo,monospace;color:var(--plum);margin:6px 0 4px}
.ph svg{width:30px;height:30px;stroke:var(--teal)}
.sechead{display:grid;gap:10px;margin-bottom:40px}
.sechead.c{text-align:center;justify-items:center}
.trust{background:var(--gray);padding-block:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.trust .wrap{display:flex;justify-content:center;text-align:center;align-items:center;gap:14px 24px;flex-wrap:wrap}
.trust strong{color:var(--plum)}
.badges{display:flex;gap:12px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.badge .stars{color:var(--teal);letter-spacing:1px}
.badge .bbb{font:700 12px var(--fd);color:var(--plum);border:1.5px solid var(--plum);border-radius:4px;padding:0 5px}

.cards{display:grid;gap:20px}
.c4{grid-template-columns:repeat(4,1fr)} .c3{grid-template-columns:repeat(3,1fr)} .c5{grid-template-columns:repeat(5,1fr)} .c6{grid-template-columns:repeat(6,1fr)} .c2{grid-template-columns:repeat(2,1fr)}
.cards>*{min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--teal);box-shadow:0 6px 20px rgba(15,110,110,.10)}
.card .more{margin-top:auto;color:var(--teal);font-weight:600;font-size:15px}
.ico{width:40px;height:40px;stroke:var(--teal);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.step .num{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 18px var(--fd)}
.stats{display:grid;gap:20px;text-align:center}
.stat .fig{font:700 40px/1.1 var(--fd);color:var(--plum);font-variant-numeric:tabular-nums}
.stat .lab{margin-top:6px}
.center-cta{text-align:center;margin-top:36px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:center;align-items:center}
.tile h3{margin-top:6px}
.tile p{font-size:15px}
.indcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.indcard .ph{border:0;border-radius:0;aspect-ratio:16/10}
.indcard div.t{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.indcard .more{color:var(--teal);font-weight:600;font-size:15px;white-space:nowrap}
.ind-5{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.ind-5>*{grid-column:span 2;min-width:0}
.ind-5>*:nth-child(4){grid-column:2 / span 2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.two>*{min-width:0}
.why{display:grid;grid-template-columns:repeat(5,1fr);gap:28px}
.why>div{display:flex;flex-direction:column;gap:8px}
.why p{font-size:15px}

details.q{border-bottom:1px solid var(--line)}
details.q summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:18px 0;font:600 17px var(--fb);color:var(--plum)}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";color:var(--teal);font:400 26px/1 var(--fb);flex:none}
details.q[open] summary::after{content:"\2212"}
details.q p{padding:0 0 20px}
.faq{max-width:800px;margin:0 auto}

.video{max-width:900px;margin:0 auto;aspect-ratio:16/9;border-radius:12px;background:linear-gradient(180deg,#ECEAEF,#E2DFE6);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.video button{width:84px;height:84px;border-radius:50%;background:var(--teal);border:0;display:grid;place-items:center;cursor:pointer}
.video button:hover{background:var(--teal-h)}
.video .lbl{position:absolute;left:14px;bottom:12px;font:600 12px ui-monospace,Menlo,monospace;color:var(--small)}

.tbl{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 14px var(--fb);color:var(--plum);background:#fff}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;color:var(--plum)}
.compare{min-width:520px}

.checks{display:grid;gap:14px;list-style:none;padding:0;margin:0}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks .ico{width:24px;height:24px;margin-top:3px}
.timeline{list-style:none;margin:0;padding:0 0 0 26px;border-left:2px solid var(--teal);display:grid;gap:26px;max-width:760px}
.timeline li{position:relative}
.timeline li::before{content:"";position:absolute;left:-34px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--teal);border:3px solid var(--gray)}
.boxg{background:var(--gray);border-radius:12px;padding:26px}
.blk{display:grid;gap:16px}

/* calculator */
.calc{max-width:800px;margin:0 auto;background:var(--gray);border-radius:12px;padding:30px;display:grid;gap:22px}
.calc label{font-weight:600;display:block;margin-bottom:6px}
.calc input[type=number]{font:500 17px var(--fb);width:100%;max-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.calc input[type=range]{width:100%;accent-color:var(--teal)}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.calc .row>*{min-width:0}
.outs{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:16px}
.out{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.out .v{font:700 24px var(--fd);color:var(--ink);font-variant-numeric:tabular-nums}
.out.big .v{font-size:32px;color:var(--plum)}
.out .k{font-size:14px}

.picker{margin-top:24px;display:grid;gap:10px}
.picker .lab{font:600 15px var(--fb);color:var(--ink)}
.picker .opts{display:flex;flex-wrap:wrap;gap:10px}
.picker .opts a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border:2px solid var(--teal);border-radius:8px;color:var(--teal);font:600 15px var(--fb);text-decoration:none;background:#fff}
.picker .opts a:hover{background:var(--teal);color:#fff}
.funded .amt{font:700 32px/1.1 var(--fd);color:var(--plum);font-variant-numeric:tabular-nums}
.funded .meta{font-weight:600;font-size:15px}
.usefor{margin-top:44px;text-align:center}
.usefor h3{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--gray);border-radius:999px;padding:8px 16px;font-weight:500;font-size:15px}
.chip .ico{width:20px;height:20px}
.seemore{display:none}
@media (max-width:700px){.funded .more-story{display:none}.funded.open .more-story{display:flex}.seemore{display:block}.funded.open+.seemore{display:none}}
/* final band */
.final{text-align:center}
.final .blk{justify-items:center}

/* footer */
footer.site{background:var(--foot);color:var(--foot-t);font-size:15px;padding-block:60px 30px}
footer.site h5{color:#fff;font:600 15px var(--fd);margin:0 0 12px}
footer.site a{color:var(--foot-t);text-decoration:none} footer.site a:hover{color:#fff;text-decoration:underline}
.ftop{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:32px;border-bottom:1px solid #3A3A40}
.ftop .logo,.ftop .logo small{color:#fff}.ftop .logo .mk{border-color:#fff}
.fcols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-block:32px;border-bottom:1px solid #3A3A40}
.fcols ul{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.find{padding-block:28px;border-bottom:1px solid #3A3A40}
.find .l{columns:4;column-gap:24px;font-size:14px}
.find .l span{display:block}
.legal{padding-top:24px;display:grid;gap:14px;font-size:13px;line-height:1.55}
.fbot{display:flex;gap:16px;flex-wrap:wrap}

/* form pages */
.formpage{background:var(--gray);min-height:70vh;padding-block:48px 64px}
.fcard{max-width:640px;margin:0 auto;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(31,31,35,.08);padding:36px}
.fcard h1{font-size:32px}
.form{display:grid;gap:16px;margin-top:24px}
.form .r2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form .r2>*{min-width:0}
.form label{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
.form input,.form select{width:100%;font:16px var(--fb);color:var(--ink);padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form input:focus,.form select:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.5;color:var(--small)}
.consent input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--teal)}
.embedtag{font:600 11px ui-monospace,Menlo,monospace;color:var(--small);border:1px dashed var(--line);border-radius:6px;padding:4px 8px;width:max-content;max-width:100%}
.lock{display:flex;gap:8px;align-items:center;font-size:14px}
.lock .ico{width:18px;height:18px}
.fhead{background:#fff;border-bottom:1px solid var(--line)}
.fhead .wrap{display:flex;justify-content:space-between;align-items:center;height:68px}
.ffoot{background:var(--foot);color:var(--foot-t);font-size:13px;padding-block:24px}
.ffoot a{color:var(--foot-t)}
.slot{border:1px dashed #CFCBD6;border-radius:10px;background:#fff;padding:22px;display:grid;gap:10px;text-align:center;color:var(--small);font-size:14px}
.times{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.times button{font:500 14px var(--fb);border:1px solid var(--teal);color:var(--teal);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
.times button[aria-pressed=true]{background:var(--teal);color:#fff}
.callbox{background:var(--gray);border-radius:10px;padding:18px 20px}
.fsline{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border-radius:999px;background:#FBEAF3;color:var(--plum);font-weight:600;font-size:15px;text-decoration:none}
.fsline:hover{background:#F6D7E8;color:var(--plum)}
.fsline .tag{background:var(--plum);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.okline{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:14px;color:var(--ink);font-weight:500}
.okline span::before{content:"? ";color:var(--teal);font-weight:700}
section.fs{background:var(--plum);color:#fff}
section.fs h2,section.fs h3{color:#fff}
.fsgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.fsgrid .kick{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px}
.fsgrid p{color:#F3E6EE;margin-top:12px}
section.fs .fsgrid .btn.light{background:#fff;color:var(--plum)!important;margin-top:22px;justify-self:start}
section.fs .fsgrid .btn.light:hover{background:#F6D7E8}
.fssteps{display:grid;gap:14px;list-style:none;margin:0;padding:0}
.fssteps li{background:rgba(255,255,255,.1);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.fssteps .n{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--plum);display:grid;place-items:center;font-weight:700}
.fssteps b{display:block;color:#fff}
.fssteps span{color:#F3E6EE;font-size:15px}
section.fs .small{color:#E7CFDD}
@media (max-width:860px){.fsgrid{grid-template-columns:1fr}}
.fitpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fitpick label{font-size:12px;display:flex;gap:4px;align-items:center}

.disc{background:var(--gray);border-radius:12px;padding:24px;font-size:13px;line-height:1.6}

@media (max-width:1080px){
  nav.main{display:none}
  .hright .tel{display:inline-block;font-size:15px}
  .menubtn{display:grid;place-items:center;margin-left:12px}
  .hright{margin-left:auto}
  .c4{grid-template-columns:repeat(2,1fr)} .c6{grid-template-columns:repeat(3,1fr)} .c5,.why{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:760px){
  body{font-size:16px}
  h1{font-size:32px} h2{font-size:24px} .fcard h1{font-size:28px}
  .wrap{padding-inline:16px}
  section{padding-block:48px} .hero{padding-block:36px 44px}
  .hero .grid,.two,.calc .row,.outs,.form .r2,.fcols{grid-template-columns:1fr;gap:28px}
  .c4,.c3,.c5,.c2,.why,.stats{grid-template-columns:1fr} .c6{grid-template-columns:repeat(2,1fr)}
  .ind-5{grid-template-columns:1fr} .ind-5>*,.ind-5>*:nth-child(4){grid-column:auto}
  .trust .wrap{flex-direction:column;text-align:center}
  .find .l{columns:2}
  .hright .btn{display:none}
  .stickybar{display:grid;grid-template-columns:1fr;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:55;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  body.hasbar{padding-bottom:70px}
  .fcard{padding:24px 18px}
  .proto .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div class="proto" role="region" aria-label="Prototype controls">
  <div class="wrap">

 +stepsSec('5. How it works ? light gray','gray')
 +sec('6. Do you qualify? ? white','white',`<div class="sechead c"><h2>Do you qualify?</h2><p><strong>No minimum credit score to apply.</strong> Most of the businesses we work with meet three simple minimums.</p></div><div class="stats c3">${[['6+ months','in business'],['$15K+','in monthly revenue'],['3 months','of recent bank statements']].map(([f,l])=>`<div class="stat"><div class="fig">${f}</div><div class="lab">${l}</div></div>`).join('')}</div><p class="small" style="text-align:center;max-width:640px;margin:28px auto 0">Don't meet all three? Apply anyway. Some programs, like equipment financing and SBA loans, have their own requirements, and your advisor will tell you what's possible.</p>`)

 +sec('8. Explainer video ? light gray · 16:9, max 900px, no autoplay','gray',`<div class="sechead c"><h2>See how Secure Biz works in 90 seconds</h2></div>${video('video-home-still.jpg')}<div class="center-cta">${getBtn()}</div>`)
 +sec('9. Industries ? white · 5 photo cards (3 + 2), then a slim row of what funding is used for','white',`<div class="sechead c"><h2>We fund businesses banks pass over</h2><p>From trucking to med spas, we work with industries banks often turn down.</p></div>${indCards()}<div class="usefor"><h3>What owners use it for</h3><div class="chips">${[['wallet','Cash flow','Cover payroll and bills between big payments.'],['boxes','Inventory','Stock up before your busy season.'],['people','Payroll','Hire and keep the team you need.'],['wrench','Equipment','Buy or replace trucks, tools and machines.'],['store','Expansion','Open a second location or renovate.'],['cal','Seasonal gaps','Stay steady through the slow months.']].map(([i,t])=>`<span class="chip">${I(i)}${t}</span>`).join('')}</div></div>`)

 +sec('12. Merchant services band ? light gray, two columns (near the bottom)','gray',`<div class="two"><div class="blk"><h2>Paying too much to take cards?</h2><p>Our Zero-Fee Processing program can cut what you pay to accept credit cards. Send us a recent processing statement and we'll show you, line by line, what you could save.</p><div><a class="btn" href="${L('merchant-services')}">See My Savings</a></div></div>${photo('merchant-pos.jpg','A card reader at a shop counter')}</div>`)

PAGES['business-funding']=()=>heroTwo('1. Hero ? white, two columns',{h1:'Business funding options',sub:'Compare eight ways to fund your business, up to $5 million, and get matched with the right one.',ph:['hero-funding.jpg','An owner reviewing numbers at a desk with an advisor on a video call']})

function productPage(p){
 const after=p.asterisk?`<p class="small" style="margin-top:10px">${esc(p.asterisk)}</p>`:'';
 return heroTwo('1. Hero ? white · product template (amount pill above H1)',{pill:p.pill,h1:p.h1,sub:p.sub,after,ph:p.photo})
 +trust()
 +sec('3. What it is and how it works ? white · max 760px','white',`<div class="narrow blk"><h2>${esc(WH[p.code][0])}</h2>${p.what.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`)
 +sec('4. Advantages ? light gray','gray',`<div class="narrow blk"><h2>Why business owners choose ${esc(p.name.toLowerCase())}</h2><ul class="checks">${p.adv.map(([b,t])=>`<li>${I('check')}<span><strong>${esc(b)}:</strong> ${esc(t)}</span></li>`).join('')}</ul></div>`)
 +sec('5. Who qualifies ? white · 5 stat blocks','white',`<div class="sechead c"><h2>Who qualifies</h2></div><div class="stats c5">${p.qual.map(([f,l])=>`<div class="stat"><div class="fig" style="font-size:30px">${esc(f)}</div><div class="lab">${esc(l)}</div></div>`).join('')}</div><p class="small" style="text-align:center;margin-top:22px">Typical guidelines. Requirements vary by lender.</p><p style="text-align:center;margin-top:10px">Credit below this? Apply anyway, since some of our programs look mostly at revenue. Or <a href="${L('fresh-start')}">see our Fresh Start Program ?</a></p>`)
 +sec('6. Compare ? light gray · 2-column table, 4 rows','gray',`<div class="sechead"><h2>${esc(WH[p.code][1])} vs. ${esc(WH[p.code][2])}</h2></div><div class="tbl"><table class="compare"><thead><tr><th></th><th>${esc(WH[p.code][1])}</th><th>${esc(WH[p.code][2])}</th></tr></thead><tbody>${p.cmp.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p style="margin-top:14px"><a href="${L('p-'+p.cmp.to)}">Learn about ${esc(PBY[p.cmp.to].name.toLowerCase())} ?</a></p>`)
 +indSec('7. Industries ? white · reuse homepage section 8','white')
 +stepsSec('8. How it works ? light gray · reuse homepage section 4','gray')
 +sec('9. FAQ ? white · 10 questions, FAQ schema','white',`<div class="sechead c"><h2>Frequently asked questions</h2></div>${faqList(p.faq)}`)
 +(p.disclosure?`<section style="padding-block:0 48px"><div class="wrap">${note('Home equity disclosure box ? full width, above footer, 13px')}<div class="disc">${esc(p.disclosure)}</div><p class="small" style="margin-top:10px">Prototype note: qualification figures on this page are pending confirmation from the lending partner. No interest rates appear anywhere on this page.</p></div></section>`:'')
 +finalBand();
}

 +sec('3. The challenge ? white · max 760px','white',`<div class="narrow blk"><h2>The challenge</h2>${i.ch.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`)
 +sec('4. What owners use funding for ? light gray · use cards 3/1','gray',`<div class="sechead c"><h2>What ${esc(i.owner)} owners use funding for</h2></div><div class="cards c3">${i.uses.map(([ic,h,r,t])=>`<div class="card">${I(ic)}<h3>${esc(h)}</h3><strong style="color:var(--plum);font-size:20px;font-variant-numeric:tabular-nums">${esc(r)}</strong><p>${esc(t)}</p></div>`).join('')}</div><p class="small" style="text-align:center;margin-top:18px">Typical amounts. Your amount depends on your business and the lender.</p>`)
 +sec('5. Best-fit products ? white · 3 product cards','white',`<div class="sechead c"><h2>Best options for ${esc(i.name.split(' & ')[0].toLowerCase())}</h2></div><div class="cards c3">${i.best.map(([c,t])=>{const p=PBY[c];return `<a class="card" href="${L('p-'+p.slug)}">${I(p.ico)}<h3>${p.name}</h3><p>${esc(t)}</p><span class="more">Learn more ?</span></a>`}).join('')}</div>`)
 +stepsSec('6. How it works ? light gray','gray')
 +sec('7. FAQ ? white · 5 questions','white',`<div class="sechead c"><h2>Frequently asked questions</h2></div>${faqList(i.faq)}`)
 +noIndBand()
 +finalBand();
}
INDUSTRIES.forEach(i=>PAGES['i-'+i.slug]=()=>industryPage(i));

PAGES.about=()=>heroTwo('Hero ? white, two columns',{h1:'Funding that fits, from people who listen',sub:'We help business owners find the right capital, without the runaround.',ph:['about.jpg','An advisor on the phone with a client, at a desk, natural light']})
 +trust()
 +sec('Our story ? white · max 760px','white',`<div class="narrow blk"><h2>Why we started Secure Biz</h2><p>Too many good businesses get told no by their bank and give up, while the opportunity in front of them slips away. We started Secure Biz Solutions to change that.</p><p>Instead of one bank and one answer, we work with a network of lending partners. We learn what your business needs, then find the options that fit, and we're honest when something doesn't.</p><p>Today our team has helped more than 10,000 businesses secure over $100 million in funding, from owner-operators with one truck to growing multi-location companies.</p></div>`)
 +sec('What we believe ? light gray · 3 cards','gray',`<div class="sechead c"><h2>How we work</h2></div><div class="cards c3">${[['check','Honest advice','We tell you the full cost of every offer, and when an option isn\'t right for you.'],['user','One advisor','You work with one person from your first call to funding.'],['cols','Your best option, not ours','We compare across lenders so you can choose with confidence.']].map(([i,h,t])=>`<div class="card">${I(i)}<h3>${h}</h3><p>${t}</p></div>`).join('')}</div>`)

 +finalBand();

 <div class="r2"><div><label for="g1">Business name</label><input id="g1" autocomplete="organization" required></div><div><label for="g2">Your full name</label><input id="g2" autocomplete="name" required></div></div>
 <div class="r2"><div><label for="g3">Email</label><input id="g3" type="email" autocomplete="email" required></div><div><label for="g4">Mobile phone</label><input id="g4" type="tel" autocomplete="tel" required></div></div>
 <div class="r2"><div><label for="g5">How much do you need?</label><select id="g5" required><option value="">Select</option><option value="25">Under $50K</option><option value="100">$50K?$250K</option><option value="500">$250K?$1M</option><option value="2000">$1M+</option></select></div>
 <div><label for="g6">Time in business</label><select id="g6" required><option value="">Select</option><option value="0">Under 6 months</option><option value="6">6?12 months</option><option value="12">1?2 years</option><option value="24">2+ years</option></select></div></div>
 <div class="r2"><div><label for="g7">Monthly revenue</label><select id="g7" required><option value="">Select</option><option value="5">Under $10K</option><option value="12">$10K?$15K</option><option value="30">$15K?$50K</option><option value="75">$50K+</option></select></div>
 <div><label for="g8">What's it for?</label><select id="g8" required><option value="">Select</option><option value="wc">Working capital / cash flow</option><option value="equip">Equipment or vehicles</option><option value="inv">Inventory</option><option value="exp">Expansion or buildout</option><option value="invoice">Waiting on unpaid invoices</option><option value="other">Something else</option></select></div></div>
 <div class="r2"><div><label for="g10">Estimated credit score <span style="font-weight:400;color:var(--small)">(a guess is fine)</span></label><select id="g10" required><option value="">Select</option><option value="0">Under 580</option><option value="580">580?599</option><option value="600">600?619</option><option value="620">620?649</option><option value="650">650?679</option><option value="680">680?719</option><option value="720">720+</option><option value="ns">Not sure</option></select></div><div style="align-self:end"><p class="small" style="margin-bottom:12px">Every credit type is welcome. Checking your options won't affect your credit score.</p></div></div>
 <label class="consent" for="g9"><input id="g9" type="checkbox"> <span>${CONSENT}</span></label>
 <button class="btn" type="submit">See My Funding Options</button>
 <p class="small" id="gerr" role="alert"></p>
 <div class="lock">${I('lock')}<span>Your information is private and secure. We never sell your data.</span></div>
 </form></div>
 <p class="small" style="max-width:640px;margin:20px auto 0">${BROKER}</p>
 <div class="note" style="max-width:640px;margin:16px auto 0;width:auto">Prototype routing (built by the integration team, not the web developer): matching answers send the visitor to /your-options/?fit=? with up to 3 product codes; no match goes to /thank-you/follow-up/. Credit "Under 580" always goes to /thank-you/fresh-start/ (booking with a funding specialist) and the lead is tagged Fresh Start in monday. "Not sure" is treated as mid-range so the advisor sorts it out on the call.</div>
 </div></div>`;

PAGES['your-options']=()=>{const fit=(FIT&&FIT.length?FIT:['term','loc','mca']).slice(0,3);
 return `<div class="formpage"><div class="wrap">${note('Your Options ? noindex · conversion page · reads the fit parameter')}
 <div class="fcard" style="max-width:860px"><h1>Good news: you have options.</h1><p style="margin-top:8px">Based on what you told us, these are the options that most likely fit your business. Your advisor is calling you shortly to walk through them.</p>
 <div class="note" style="margin-top:16px;width:auto">Showing fit=${fit.join(',')}${FIT?'':' (default when the parameter is missing)'} · Try other codes:
 <span class="fitpick">${PRODUCTS.map(p=>`<label><input type="checkbox" data-fit="${p.code}" ${fit.includes(p.code)?'checked':''}>${p.code}</label>`).join(' ')}</span></div>
 <div class="cards ${fit.length>=3?'c3':fit.length===2?'c2':''}" style="margin-top:20px">${fit.map(c=>{const p=PBY[c];return `<a class="card" href="${L('p-'+p.slug)}">${I(p.ico)}<h3>${p.name}</h3><p>${esc(p.card)}</p><span class="more">Learn more ?</span></a>`}).join('')}</div>
 <div class="callbox" style="margin-top:24px">Your advisor will call you shortly from <strong>${PHONE}</strong>. Save the number so you know it's us.</div>
 <h2 style="margin-top:32px">Prefer to pick a time?</h2>${booking()}
 <h2 style="margin-top:32px">Want a faster answer?</h2><p style="margin-top:8px">Upload your three most recent business bank statements now. This step is optional; your advisor can collect them on the call.</p>
 <div class="slot" style="margin-top:14px"><span class="embedtag" style="margin:0 auto">JotForm embed · document upload (receives sid)</span><label for="up" style="font-weight:600;color:var(--ink)">Bank statements (optional)</label><input id="up" type="file" multiple accept=".pdf,image/*" style="margin:0 auto"></div>
 </div></div></div>`};
function booking(who){const days=['Mon','Tue','Wed','Thu','Fri'];return `<div class="slot" style="margin-top:14px"><span class="embedtag" style="margin:0 auto">Google Calendar appointment booking page · embedded, full card width</span><p style="color:var(--ink)">Choose a ${who||'15-minute call with your advisor'} · Mon?Fri, 9 a.m.?5 p.m. ET</p><div class="times">${days.flatMap(d=>['10:00 AM','2:30 PM'].map(t=>`<button type="button" aria-pressed="false">${d} ${t}</button>`)).join('')}</div><p id="bookmsg"></p></div>`}
const FS_STEPS=[['Review your profile','A funding specialist walks through your credit and business with you, so you know exactly where you stand.'],['Get your plan','We show you what\'s holding you back, what to work on first and what score and numbers each funding option looks for.'],['Get funding-ready','We stay with you as you work the plan and match you with funding as soon as you qualify.']];
const fsBand=(n)=>`<section class="fs"><div class="wrap">${note(n)}<div class="fsgrid"><div><span class="kick">Fresh Start Program</span><h2>Credit not where it needs to be?</h2><p>Don't walk away. Our Fresh Start Program gives you a clear, step-by-step plan to become funding-ready, built around the options you're working toward.</p><a class="btn light" href="${L('fresh-start')}">Talk to a Funding Specialist</a><p class="small" style="margin-top:12px">Free consultation. Results vary, and we can't promise a specific score or approval.</p></div><ol class="fssteps">${FS_STEPS.map(([h,t],i)=>`<li><span class="n">${i+1}</span><div><b>${esc(h)}</b><span>${esc(t)}</span></div></li>`).join('')}</ol></div></div></section>`;
const FS_FAQ=[['Who is the Fresh Start Program for?','Business owners whose credit is keeping them from the funding they want right now, whether a lender said no or you think they might.'],['Does it cost anything to talk to a specialist?','No. The first consultation is free and there\'s no obligation. Your specialist explains any program costs in writing before you decide.'],['Will this hurt my credit score?','No. Booking a call and reviewing your options doesn\'t affect your credit score.'],['Can you guarantee I\'ll qualify?','No one honestly can. What we do is show you exactly what each option looks for and give you a plan to get there. Many owners also qualify for revenue-based options right away.'],['Do I need an attorney?','Most people don\'t. If our review finds that something on your credit report may have violated your rights, we can connect you with a consumer protection attorney to look at your case.'],['How long does it take?','It depends on your profile. Your specialist gives you a realistic timeline on the first call.']];
PAGES['fresh-start']=()=>`<section class="hero center"><div class="wrap">${note('1. Hero ? white, centered · landing page for ads and "bad credit business funding" searches')}<span class="pill">Fresh Start Program</span><h1 style="margin-top:14px">Credit holding your business back?</h1><p class="sub">Get a clear, step-by-step plan to become funding-ready, from a funding specialist who works with owners in your spot every day.</p><div class="actions" style="justify-content:center"><a class="btn" href="#fsbook" data-scroll="fsbook">Book a Free Call</a></div><div class="okline" style="justify-content:center"><span>Free consultation</span><span>Won't affect your credit score</span><span>No obligation</span></div></div></section>`
 +trust()
 +sec('3. How it works ? light gray · 3 steps','gray',`<div class="sechead c"><h2>How Fresh Start works</h2></div><div class="cards c3">${FS_STEPS.map(([h,t],i)=>`<div class="card step"><div class="num">${i+1}</div><h3>${esc(h)}</h3><p>${esc(t)}</p></div>`).join('')}</div>`)
 +sec('4. You may qualify sooner than you think ? white','white',`<div class="two"><div class="blk"><h2>You may qualify sooner than you think</h2><p>Some funding options look mostly at your revenue and bank deposits, not your score. On your call, your specialist checks those first. If they're a fit, you can move ahead now while you work your plan.</p><p>When something on your credit report may have violated your rights under consumer protection law, we work with consumer protection attorneys who can review your case.</p><p><a href="${L('p-merchant-cash-advance')}">See revenue-based funding ?</a></p></div>${photo('fresh-start.jpg','A business owner on a call with a funding specialist')}</div>`)
 +sec('5. Book your call ? light gray · Google Calendar booking embedded on the page','gray',`<div id="fsbook" class="narrow"><div class="sechead c"><h2>Talk to a Funding Specialist</h2><p>Pick a time that works for you. It's free.</p></div>${booking('free 20-minute call with a funding specialist')}</div>`)
 +sec('6. FAQ ? white · FAQ schema','white',`<div class="sechead c"><h2>Fresh Start questions</h2></div>${faqList(FS_FAQ)}<p class="small" style="text-align:center;max-width:720px;margin:24px auto 0">The Fresh Start Program is a consultation and planning service. Results vary, and we don't guarantee any specific credit score, approval or funding.</p>`)
 +finalBand();
PAGES['thank-you-fresh-start']=()=>`<div class="formpage"><div class="wrap">${note('Thank You ? Fresh Start · noindex · conversion · for applicants who pick credit "Under 580"')}<div class="fcard blk" style="max-width:760px"><span class="pill" style="justify-self:start">Fresh Start Program</span><h1>Thanks. You're not out of options.</h1><p>Based on your answers, the fastest path is a quick call with a funding specialist. They'll look at your full picture, check the options that focus on revenue instead of credit, and build you a step-by-step plan to get funding-ready.</p><h2 style="margin-top:12px">Book your free call</h2>${booking('free 20-minute call with a funding specialist')}<div class="callbox">If you don't book, a specialist will call you within one business day from <strong>${PHONE}</strong>.</div></div></div></div>`;
PAGES['thank-you-merchant']=()=>`<div class="formpage"><div class="wrap">${note('Thank You ? Statement Review · noindex · conversion')}<div class="fcard blk"><h1>We've got your statement.</h1><p>We'll review it line by line and get back to you within one to two business days with your savings.</p><a href="${L('get-funded')}">Need funding too? See your options ?</a></div></div></div>`;
PAGES['thank-you-follow-up']=()=>`<div class="formpage"><div class="wrap">${note('Specialist Follow-Up · noindex · conversion · for leads that match no product yet')}<div class="fcard blk"><h1>Thanks, we're on it.</h1><p>A funding specialist will review your information and reach out within one business day to talk through what's possible for your business. Want to pick the time? Book it below.</p>${booking()}</div></div></div>`;

/* ---------- router ---------- */
const app=document.getElementById('app');
function route(){
 let k=(location.hash||'#home').slice(1); if(!PAGES[k]) k='home';
 const form=FORM_PAGES.includes(k);
 app.innerHTML=form?fHead()+PAGES[k]()+fFoot():header()+PAGES[k]()+footer();
 document.body.classList.toggle('hasbar',!form);
 document.getElementById('purl').textContent=R[k];
 document.title='Secure Biz Website Prototype';
 window.scrollTo(0,0);
 wire(k);
}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function wire(k){
 const mo=document.getElementById('menuOpen'),mm=document.getElementById('mmenu');
 if(mo){mo.onclick=()=>{mm.hidden=false};document.getElementById('menuClose').onclick=()=>{mm.hidden=true};mm.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',()=>{mm.hidden=true}))}
 app.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=e=>{e.preventDefault();const t=document.getElementById(b.dataset.scroll);if(t)t.scrollIntoView({behavior:'smooth'})});
 app.querySelectorAll('[data-video]').forEach(b=>b.onclick=()=>{b.parentElement.querySelector('.lbl').textContent='Prototype: the finished video plays here, in place ? no popup, no new tab.'});
 const calc=document.getElementById('calc');
 if(calc){const cs=calc.querySelector('#cs'),csr=calc.querySelector('#csr'),cr=calc.querySelector('#cr'),fee=calc.querySelector('#fee');
  const run=()=>{let s=Math.min(500000,Math.max(5000,+cs.value||0)),r=Math.min(5,Math.max(1.5,+cr.value||0)),f=Math.max(0,+fee.value||0);FEE=f;
   const c1=s*r/100,sv=(c1-f)*12;calc.querySelector('#o1').textContent=money(c1)+'/mo';calc.querySelector('#o2').textContent=money(f)+'/mo';
   calc.querySelector('#o3').textContent=sv>0?money(sv)+'/yr':'Let\'s look at your statement'; calc.querySelector('#o3').style.fontSize=sv>0?'':'20px'};
  cs.oninput=()=>{csr.value=cs.value;run()};csr.oninput=()=>{cs.value=csr.value;run()};cr.oninput=run;fee.oninput=run;run()}
 const mf=document.getElementById('mform');
 if(mf)mf.onsubmit=e=>{e.preventDefault();const miss=['m1','m2','m3','m4'].filter(i=>!mf.querySelector('#'+i).value.trim());if(miss.length){mf.querySelector('#merr').textContent='Fill in your business name, name, email and phone so we can send your review.';mf.querySelector('#'+miss[0]).focus();return}location.hash='thank-you-merchant'};
 const cf=document.getElementById('cform');
 if(cf)cf.onsubmit=e=>{e.preventDefault();cf.querySelector('#cmsg').textContent='Prototype: in the live site, JotForm sends this message to the monday.com board. Nothing was sent.'};
 const gf=document.getElementById('gform');
 if(gf&&PRESET){gf.querySelector('#g5').value=PRESET;PRESET=''}
 if(gf)gf.onsubmit=e=>{e.preventDefault();const ids=['g1','g2','g3','g4','g5','g6','g7','g8','g10'];const miss=ids.filter(i=>!gf.querySelector('#'+i).value.trim());
  if(miss.length){gf.querySelector('#gerr').textContent='A few answers are missing. Fill in the highlighted fields to see your options.';ids.forEach(i=>gf.querySelector('#'+i).style.borderColor=miss.includes(i)?'#B3261E':'');gf.querySelector('#'+miss[0]).focus();return}
  const amt=+gf.g5.value,tib=+gf.g6.value,rev=+gf.g7.value,use=gf.g8.value,cv=gf.g10.value,cr=cv==='ns'?600:+cv;let f=[];
  if(cv==='0'){FIT=null;location.hash='thank-you-fresh-start';return}
  if(use==='equip')f.push('equip');if(use==='invoice')f.push('factor');
  if(tib>=24&&rev>=30&&amt>=150&&cr>=650)f.push('sba');
  if(tib>=12&&rev>=12&&cr>=600)f.push('term','loc');
  if(tib>=6&&rev>=12)f.push('mca');
  if(tib===0&&use==='equip')f=['equip'];
  if(amt<=100&&cr>=680)f.push('card');
  f=[...new Set(f)].slice(0,3);
  if(!f.length){FIT=null;location.hash='thank-you-follow-up';return}
  FIT=f;location.hash='your-options'};
 app.querySelectorAll('[data-fit]').forEach(c=>c.onchange=()=>{const s=[...app.querySelectorAll('[data-fit]:checked')].map(x=>x.dataset.fit).slice(0,3);FIT=s;route()});
 app.querySelectorAll('.times button').forEach(b=>b.onclick=()=>{app.querySelectorAll('.times button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');const m=b.closest('.slot').querySelector('#bookmsg');if(m)m.textContent='Prototype: '+b.textContent+' selected. The live Google Calendar booking page confirms it and sends a calendar invite.'});
}
/* page list */
const groups=[['Core pages',['home','how-it-works','business-funding','high-risk','fresh-start','merchant-services']],['Product pages (one template)',PRODUCTS.map(p=>'p-'+p.slug)],['Industry pages (one template)',INDUSTRIES.map(i=>'i-'+i.slug)],['Simple pages',['about','faq','contact','privacy-policy','terms']],['Form and confirmation pages',FORM_PAGES]];
let n=0;document.getElementById('pagesList').innerHTML=groups.map(([g,ks])=>`<h4>${g}</h4>${ks.map(k=>`<a href="#${k}">${++n}. ${esc(TITLES[k])}<span>${R[k]}</span></a>`).join('')}`).join('');
const pg=document.getElementById('pages');
document.getElementById('pagesBtn').onclick=()=>{pg.hidden=false};
document.getElementById('pagesClose').onclick=()=>{pg.hidden=true};
pg.addEventListener('click',e=>{if(e.target===pg||e.target.closest('a'))pg.hidden=true});
const nb=document.getElementById('notesBtn');
nb.onclick=()=>{const on=document.body.classList.toggle('shownotes');nb.setAttribute('aria-pressed',on);nb.textContent=on?'Hide build notes':'Show build notes'};
document.addEventListener('click',e=>{const sm=e.target.closest('[data-seemore]');if(sm){document.getElementById('fundedGrid').classList.add('open')}const a=e.target.closest('[data-amt]');if(a)PRESET=a.dataset.amt},true);
window.addEventListener('hashchange',route);
route();
})();
</script>

</body></html>
